\* RONDB-1150 X3.4. X4 of revision 14, a COMMIT or COMPLETE from a failed node
\* may run after LQH_TRANSREQ, and LQH does not drop the late COMPLETE (X4.9's
\* drop went with rule F). NoLqhCrash is MC_late_tc's. Expected: no error.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 1
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = TRUE
    DI2Rule = TRUE
    PartialSR = FALSE
    LazyComplete = FALSE
    SkipDirty = TRUE
    Fallback = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
