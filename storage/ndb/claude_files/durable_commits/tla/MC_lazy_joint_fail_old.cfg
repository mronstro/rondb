\* RONDB-1150 X6.9. As MC_lazy_joint_fail, where a restart needs only a
\* node of each node group that is not stale (X6.1-X6.8 as first
\* written): n1 and n3 fail together, t2 commits on n2, and a restart of
\* n1 and n3 alone loses it. The control, G1 only (VisibleStays fails
\* first, when t2 is visible on n2). Expected: G1 violated.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 2
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = TRUE
    LazyComplete = TRUE
    SkipDirty = TRUE
    Fallback = TRUE
    GroupLoss = FALSE
    RefinedStale = TRUE
    JointFail = TRUE
    WholeGroup = FALSE

SPECIFICATION Spec

INVARIANTS
    G1
