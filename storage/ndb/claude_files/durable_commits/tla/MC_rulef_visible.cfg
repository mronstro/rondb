\* RONDB-1150 X3.4. Rule F on: the takeover aborts a transaction that was
\* visible on the node that failed with its TC. Expected: VisibleStays
\* violated.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 1
    RuleF = TRUE
    DropLateComplete = TRUE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE

SPECIFICATION Spec

INVARIANTS
    VisibleStays
