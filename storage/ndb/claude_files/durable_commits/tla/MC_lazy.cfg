\* RONDB-1150 X3.4. X4 as committed since plan revision 15: as MC_x4 with
\* the COMPLETE not fenced, so a crash may lose any COMPLETE after the last
\* barrier of its log part. Expected: no error.
\* Run with run_tlc.sh (README.md).

