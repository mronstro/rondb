    Dirty <- MCDirtyNone
    MaxFailures = 1
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE
    LazyComplete = TRUE
    SkipDirty = TRUE
