\* RONDB-1150 X6.3. As MC_lazy_twofail_partial, where the second failure
\* may be of the last live node of a node group: the survivors record it
\* and the cluster stops. With a recorded failure stale only if a node of
\* its node group outlived it, the guarantees hold, also in partial
\* restarts, and a restart of every node is allowed (FullRestartAllowed).
\* Expected: no error.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 2
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = TRUE
    LazyComplete = TRUE
    SkipDirty = TRUE
    Fallback = TRUE
    GroupLoss = TRUE
    RefinedStale = TRUE
    JointFail = FALSE
    WholeGroup = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
    FullRestartAllowed
