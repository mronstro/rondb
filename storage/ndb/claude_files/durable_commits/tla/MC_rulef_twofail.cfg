\* RONDB-1150 X3.4. Rule F on, two node failures: the TC fails during a
\* rule-F abort and the takeover completes the transaction (finding 2);
\* NoLqhCrash is MC_late_tc's. Expected: CompleteExcludesAbort violated.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 2
    RuleF = TRUE
    DropLateComplete = TRUE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    NextSR
    NoSharedRowInDoubt
