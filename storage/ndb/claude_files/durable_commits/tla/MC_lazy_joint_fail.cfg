\* RONDB-1150 X6.9. As MC_lazy_twofail_partial, where two nodes of
\* different node groups may fail together and record nothing of each
\* other; a restart needs every node of some node group (WholeGroup), as
\* QMGR's check_startup() and NDBCNTR's trySystemRestart() require with
\* durable commits. Expected: no error.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 2
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = TRUE
    LazyComplete = TRUE
    SkipDirty = TRUE
    Fallback = TRUE
    GroupLoss = FALSE
    RefinedStale = TRUE
    JointFail = TRUE
    WholeGroup = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
