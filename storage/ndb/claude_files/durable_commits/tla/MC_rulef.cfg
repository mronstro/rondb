\* RONDB-1150 X3.4. Rule F on (X5's default), one node failure, all but
\* VisibleStays (MC_rulef_visible). Expected: no error.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 1
    RuleF = TRUE
    DropLateComplete = TRUE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLqhCrash
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    NextSR
    NoSharedRowInDoubt
