    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxnsDirty
    Dirty <- MCDirtyTd
    MaxFailures = 1
    RuleF = FALSE
    DropLateComplete = TRUE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLqhCrash
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
