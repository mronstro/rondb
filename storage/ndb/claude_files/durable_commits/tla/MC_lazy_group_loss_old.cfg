\* RONDB-1150 X6.3. The control of MC_lazy_group_loss: any recorded
\* failure after R makes its node stale (X6.1-X6.4 as committed). When a
\* node group is lost, both of its nodes are stale, and no restart with
\* every node is allowed. Expected: FullRestartAllowed violated.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 2
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE
    LazyComplete = TRUE
    SkipDirty = TRUE
    Fallback = TRUE
    GroupLoss = TRUE
    RefinedStale = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
    FullRestartAllowed
