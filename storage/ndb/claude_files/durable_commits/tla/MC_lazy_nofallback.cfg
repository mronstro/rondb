\* RONDB-1150 X3.4. As MC_lazy without step C's count rule: a crash that
\* loses the COMPLETEs of a transaction that was visible leaves it to the
\* count rule, so this shows that the crash cuts bite and that the rule is
\* needed. Expected: VisibleStays violated.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 1
    RuleF = FALSE
    TakeoverFCommitted = TRUE
    DropLateComplete = FALSE
    LateFromFailedTc = FALSE
    DI2Rule = TRUE
    PartialSR = FALSE
    LazyComplete = TRUE
    SkipDirty = TRUE
    Fallback = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLqhCrash
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
