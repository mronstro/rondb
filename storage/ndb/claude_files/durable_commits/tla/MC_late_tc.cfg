\* RONDB-1150 X3.4. Rule F off, a COMMIT from a failed node runs after
\* LQH_TRANSREQ. Expected: NoLqhCrash violated.
\* Run with run_tlc.sh (README.md).

CONSTANTS
    Nodes <- MCNodes
    NG <- MCNG
    Rows <- MCRows
    Chain <- MCChain
    TxnRows <- MCTxnRows
    TC <- MCTC
    TransId <- MCTransId
    OldTxn <- MCOldTxn
    OldLog <- MCOldLog
    Paths <- MCPaths
    Txns <- MCTxns
    Dirty <- MCDirtyNone
    MaxFailures = 1
    RuleF = FALSE
    DropLateComplete = TRUE
    LateFromFailedTc = TRUE
    DI2Rule = TRUE
    PartialSR = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLqhCrash
    CommitBeforeComplete
    CompleteExcludesAbort
    G1
    G2Whole
    G3Same
    RowOrder
    AbortStays
    VisibleStays
    NextSR
    NoSharedRowInDoubt
